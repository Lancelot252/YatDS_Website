name: Deploy YatDS

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: yatds-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Request production deployment
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_URL:?Set the DEPLOY_URL Actions variable}"
          : "${DEPLOY_TOKEN:?Set the DEPLOY_TOKEN Actions secret}"
          result=$(curl --fail-with-body --silent --show-error \
            --proto '=https' --connect-timeout 10 --max-time 210 \
            --request POST --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --write-out '\n%{http_code}' "$DEPLOY_URL")
          status="${result##*$'\n'}"
          [[ "$status" == 200 ]] || { echo "Unexpected HTTP status $status"; exit 1; }
          printf '%s\n' "${result%$'\n'*}"
